name: Paso 3 — Fisicas 2D y Gravedad

on:
  push:
    branches:
      - main
    paths:
      - 'app/shared/src/commonMain/kotlin/io/github/kevinah95/l07_activity/core/Game.kt'
      - '.github/workflows/3-step.yml'

jobs:
  check_step_3:
    name: Verificar Paso 3
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar si el issue esta en el Paso 3
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=$(gh issue list --label "ejercicio" --state open --json number --jq '.[0].number')
          if [ -z "$ISSUE_NUMBER" ] || [ "$ISSUE_NUMBER" = "null" ]; then
            echo "⏭️ No hay issue de ejercicio abierto. Omitiendo."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -q "^paso-3$"; then
            echo "⏭️ El issue no tiene la etiqueta 'paso-3'. Este paso no esta activo."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        if: steps.gate.outputs.active == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ejecutar pruebas unitarias de Paso 3
        if: steps.gate.outputs.active == 'true'
        id: test
        run: |
          cd app
          chmod +x ./gradlew
          if ./gradlew :shared:jvmTest --tests "*Step3PhysicsTest*" --no-daemon; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar retroalimentacion si las pruebas fallaron
        if: steps.gate.outputs.active == 'true' && steps.test.outputs.passed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ steps.gate.outputs.issue_number }}"
          FEEDBACK_BODY=$(cat .github/step-feedback/step-3-mistake.md)
          gh issue comment "$ISSUE_NUMBER" --body "$FEEDBACK_BODY"
          exit 1

      - name: Transicionar a Paso 4 en el issue
        if: steps.gate.outputs.active == 'true' && steps.test.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ steps.gate.outputs.issue_number }}"
          gh issue edit "$ISSUE_NUMBER" --remove-label "paso-3" --add-label "paso-4"
          HEADER=$(cat .github/step-feedback/step-3-success.md)
          BODY=$(cat .github/steps/4-step.md)
          gh issue comment "$ISSUE_NUMBER" --body "$HEADER"$'\n\n'"$BODY"
